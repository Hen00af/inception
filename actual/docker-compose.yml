version: '3.8'

services:
  # ===================
  # MariaDB (Database)
  # ===================
  mariadb:
    container_name: mariadb
    build: ./srcs/services/marinadb
    restart: always
    env_file: .env
    networks:
      - inception_net
    volumes:
      - mariadb_data:/var/lib/mysql

