# ======================
#   Networks
# ======================
networks:
  inception_net:
    driver: bridge
    name: inception_net

# ======================
#   Volumes
# ======================
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      device: ${DATA_PATH}/mariadb
      o: bind
