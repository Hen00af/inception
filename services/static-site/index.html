<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>static-site</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>static-site</h1>
<input id="file" type="file">
<button id="upload" type="button">Upload</button>
<p id="status"></p>
<hr>
<button id="refresh" type="button">ファイル一覧を取得</button>
<select id="files" size="8"></select>
<button id="download" type="button">選択したファイルを取得</button>
<dialog id="credentials">
  <form method="dialog">
    <p><label>FTP username <input name="username" autocomplete="username" required autofocus></label></p>
    <p><label>FTP password <input name="password" type="password" autocomplete="current-password" required></label></p>
    <button type="submit" value="confirm">OK</button>
    <button type="submit" value="cancel" formnovalidate>キャンセル</button>
  </form>
</dialog>
<script src="script.js"></script>
</body>
</html>
