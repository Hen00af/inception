server {
    listen 8080;
    server_name _;
    root /srv/static;
    index index.html;
    sendfile off;
    add_header Cache-Control "no-store" always;

    location = /files {
        proxy_pass http://upload-api:8000/files;
    }
    location /files/ {
        proxy_pass http://upload-api:8000/files/;
        proxy_buffering off;
    }
    location = /upload {
        proxy_pass http://upload-api:8000/upload;
        proxy_request_buffering off;
        client_max_body_size 20m;
    }
    location = /__dev_reload.js {
        alias /srv/dev/reload.js;
        default_type application/javascript;
    }
    location = / {
        rewrite ^ /index.html last;
    }
    location = /index.html {
        sub_filter_once on;
        sub_filter '<head>' '<head><script src="/static/__dev_reload.js" defer></script>';
        try_files $uri =404;
    }
    location ~ \.(js|css)$ {
        try_files $uri =404;
    }
    location / {
        return 404;
    }
}
